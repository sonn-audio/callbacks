<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TIDAL OAuth Redirect</title>
  </head>
  <body>
    <script>
      'use strict';
      const urlParams = new URLSearchParams(window.location.search);
      const redirectUrl = decodeURIComponent(urlParams.get('state') || '');

      // Only ever hand the code back to a web address: the local sonn server that started the flow.
      let target = null;
      try {
        const parsed = new URL(redirectUrl);
        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
          target = parsed;
        }
      } catch {
        target = null;
      }

      // Pass on the code, or TIDAL's error when the login was refused, so sonn can say which.
      const forwarded = ['code', 'error', 'error_description'];
      let carried = false;
      if (target) {
        for (const name of forwarded) {
          const value = urlParams.get(name);
          if (value) {
            target.searchParams.set(name, value);
            carried = true;
          }
        }
      }

      if (target && carried) {
        window.location.replace(target.toString());
      } else {
        document.write('<p>Missing redirect information.</p>');
      }
    </script>
  </body>
</html>
